<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Chat Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #6366f1; 
            --primary-hover: #4f46e5;
            --bg: #0f172a; 
            --sidebar: #1e293b; 
            --card: #1e293b; 
            --input: #334155; 
            --border: #334155; 
            --text: #f1f5f9; 
            --text-muted: #94a3b8;
            --header: #ffffff; 
            --user-msg: #6366f1; 
            --other-msg: #334155;
            --other-msg-text: #f1f5f9;
        }
        
        body.light-mode { 
            --bg: #f8fafc; 
            --sidebar: #ffffff; 
            --card: #ffffff; 
            --input: #f1f5f9; 
            --border: #e2e8f0; 
            --text: #334155; 
            --text-muted: #64748b;
            --header: #0f172a; 
            --user-msg: #6366f1; 
            --other-msg: #f1f5f9;
            --other-msg-text: #0f172a;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            transition: background 0.3s, color 0.3s;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .rail { width: 72px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 24px; flex-shrink: 0; z-index: 10; }
        .rail-item { width: 48px; height: 48px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; opacity: 0.5; color: inherit; transition: all 0.2s ease; }
        .rail-item span { font-size: 9px; font-weight: 700; margin-top: 4px; letter-spacing: 0.5px; }
        .rail-item:hover { background: var(--input); opacity: 1; transform: translateY(-2px); }
        .active-nav { background: var(--primary); color: white; opacity: 1; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }

        .inbox { width: 320px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .inbox-header { padding: 24px 20px 16px; }
        .inbox-header h3 { margin: 0 0 16px; font-size: 20px; font-weight: 700; color: var(--header); }
        
        .section-label { font-size: 11px; font-weight: 700; color: var(--text-muted); padding: 20px 20px 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        #chat-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
