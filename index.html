<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pigeon Messenger Pro</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary: #3ecf8e; --user-msg: #3b82f6; --bg: #0b0e11; --card: #1c2127; --input: #2d333b; --border: #444c56; --text: #adbac7; --header: #ffffff; }
        body.light-mode { --bg: #f6f8fa; --card: #ffffff; --input: #f6f8fa; --border: #d0d7de; --text: #24292f; --header: #1f2328; }
        * { box-sizing: border-box; transition: 0.1s; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; height: 100vh; margin: 0; padding: 10px; overflow: hidden; }
        .container { width: 100%; max-width: 450px; background: var(--card); border-radius: 32px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .screen { display: none; flex-direction: column; height: calc(100% - 65px); padding: 20px; }
        .active { display: flex !important; }
        input { background: var(--input); border: 1px solid var(--border); color: var(--header); padding: 14px; border-radius: 12px; outline: none; width: 100%; margin-bottom: 10px; }
        button { border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; background: var(--primary); color: #000; width: 100%; }
        .nav-bar { position: absolute; bottom: 0; width: 100%; height: 65px; background: var(--card); border-top: 1px solid var(--border); display: none; z-index: 10; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; opacity: 0.5; }
        .active-nav { opacity: 1; color: var(--primary); }
        #output { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 0; }
        .msg { padding: 10px 14px; border-radius: 18px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .msg-me { align-self: flex-end; background: var(--user-msg); color: white; border-bottom-right-radius: 4px; }
        .msg-other { align-self: flex-start; background: var(--input); color: var(--header); border-bottom-left-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="screen active" style="justify-content:center;">
        <h2 style="text-align:center;">Vault Chat</h2>
        <input type="text" id="l-u" placeholder="Username">
        <input type="password" id="l-p" placeholder="Password">
        <button onclick="auth('login')">Sign In</button>
        <p onclick="showScreen('signup-screen')" style="text-align:center; font-size:13px; cursor:pointer; opacity:0.7; margin-top:15px;">Create Account</p>
    </div>

    <div id="signup-screen" class="screen" style="justify-content:center;">
        <h2>Register</h2>
        <input type="text" id="s-u" placeholder="Username">
        <input type="password" id="s-p" placeholder="Password">
        <button onclick="auth('signup')">Sign Up</button>
        <p onclick="showScreen('login-screen')" style="text-align:center; font-size:13px; cursor:pointer; opacity:0.7; margin-top:15px;">Back to Login</p>
    </div>

    <div id="home-screen" class="screen">
        <h3>Chats</h3>
        <div style="display:flex; gap:8px;">
            <input type="text" id="new-u" placeholder="Username(s)..." style="margin:0;">
            <button onclick="startChat()" style="width:50px;">+</button>
        </div>
        <div id="chat-list" style="margin-top:15px; overflow-y:auto;"></div>
    </div>

    <div id="settings-screen" class="screen">
        <h3>Settings</h3>
        <button onclick="logout()" style="background:#ff4d4d; color:white;">Sign Out</button>
    </div>

    <div id="chat-window" class="screen" style="position:absolute; inset:0; z-index:100; background:var(--card); display:none;">
        <div style="display:flex; align-items:center; gap:15px; padding-bottom:10px; border-bottom:1px solid var(--border);">
            <span onclick="closeChat()" style="cursor:pointer; font-size:20px;">←</span>
            <b id="c-t">Chat</b>
        </div>
        <div id="output"></div>
        <div style="display:flex; gap:8px; padding-top:10px;">
            <input type="text" id="m-i" placeholder="Message..." style="margin:0;">
            <button onclick="send()" style="width:50px;">➤</button>
        </div>
    </div>

    <div class="nav-bar" id="nb">
        <div class="nav-item active-nav" id="n-h" onclick="nav('home-screen')">CHATS</div>
        <div class="nav-item" id="n-s" onclick="nav('settings-screen')">SETTINGS</div>
    </div>
</div>

<script>
    // 1. INITIALIZE IMMEDIATELY
    const S_URL = 'https://supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsZmRnZ3ppbG5kdnRieWZxYmRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwNDUwOTgsImV4cCI6MjA4NzYyMTA5OH0.XlzFZSA';
    const supabaseClient = supabase.createClient(S_URL, S_KEY);

    let user = null, curParts = [], channel = null;

    // 2. RUN APP
    window.onload = () => {
        const cached = localStorage.getItem('v_u');
        if (cached) { 
            user = JSON.parse(cached); 
            loginOk(); 
        }
    };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function nav(id) {
        showScreen(id);
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
        document.getElementById(id === 'home-screen' ? 'n-h' : 'n-s').classList.add('active-nav');
    }

    async function auth(type) {
        const u = document.getElementById(type === 'login' ? 'l-u' : 's-u').value.toLowerCase().trim();
        const p = document.getElementById(type === 'login' ? 'l-p' : 's-p').value;
        
        if (!u || !p) return alert("Fill fields");

        if (type === 'signup') {
            const { error } = await supabaseClient.from('users').insert([{ username: u, password: p }]);
            if (error) return alert("User exists");
            alert("Done! Sign in."); 
            showScreen('login-screen');
        } else {
            const { data, error } = await supabaseClient.from('users').select('*').eq('username', u).eq('password', p).maybeSingle();
            if (data) { 
                user = data; 
                localStorage.setItem('v_u', JSON.stringify(data)); 
                loginOk(); 
            } else {
                alert("Fail: Check credentials or RLS policies.");
            }
        }
    }

    function loginOk() {
        showScreen('home-screen');
        document.getElementById('nb').style.display = 'flex';
        loadList();
    }

    async function startChat() {
        const val = document.getElementById('new-u').value;
        if (!val) return;
        const parts = [...new Set([...val.split(',').map(x=>x.trim().toLowerCase()), user.username])].sort();
        const gName = parts.length > 2 ? prompt("Group Name?") : null;
        
        await supabaseClient.from('messages').insert([{ participants: parts, sender: 'SYS', content: 'Start', group_name: gName }]);
        document.getElementById('new-u').value = '';
        loadList();
    }

    async function loadList() {
        const { data } = await supabaseClient.from('messages').select('*').contains('participants', [user.username]).order('created_at', {ascending: false});
        const list = document.getElementById('chat-list'); 
        list.innerHTML = '';
        const seen = new Set();
        
        if (data) data.forEach(m => {
            const key = m.participants.sort().join('|');
            if (!seen.has(key)) {
                seen.add(key);
                const item = document.createElement('div');
                item.style = "padding:15px; background:var(--input); border-radius:12px; margin-bottom:8px; cursor:pointer;";
                let label = m.group_name || m.participants.find(p => p !== user.username);
                item.innerHTML = `<b>${label || 'Me'}</b>`;
                item.onclick = () => openChat(m.participants, label, m.group_name);
                list.appendChild(item);
            }
        });
    }

    async function openChat(parts, title, gName) {
        curParts = parts;
        document.getElementById('c-t').innerText = title;
        document.getElementById('chat-window').style.display = 'flex';
        document.getElementById('output').innerHTML = 'Loading...';
        
        await loadMsgs();
        
        if (channel) supabaseClient.removeChannel(channel);
        channel = supabaseClient.channel('room').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
            const incomingParts = p.new.participants.sort().join('|');
            if (incomingParts === curParts.sort().join('|')) render(p.new);
        }).subscribe();
    }

    async function loadMsgs() {
        const { data } = await supabaseClient.from('messages').select('*').order('created_at', {ascending: true});
        document.getElementById('output').innerHTML = '';
        if (data) {
            const sortedCur = curParts.sort().join('|');
            data.filter(m => m.participants.sort().join('|') === sortedCur).forEach(render);
        }
    }

    async function send() {
        const val = document.getElementById('m-i').value;
        if (!val) return;
        
        // Find group name if it exists for this participant set
        const { data } = await supabaseClient.from('messages').select('group_name').contains('participants', curParts).limit(1).maybeSingle();
        
        await supabaseClient.from('messages').insert([{ 
            participants: curParts, 
            sender: user.username, 
            content: val, 
            group_name: data?.group_name || null 
        }]);
        document.getElementById('m-i').value = '';
    }

    function render(m) {
        if (m.sender === 'SYS') return;
        const d = document.createElement('div');
        d.className = `msg ${m.sender === user.username ? 'msg-me' : 'msg-other'}`;
        d.innerHTML = `<small style="opacity:0.5; font-size:10px; display:block;">${m.sender}</small>${m.content}`;
        document.getElementById('output').appendChild(d);
        document.getElementById('output').scrollTop = 99999;
    }

    function closeChat() { document.getElementById('chat-window').style.display = 'none'; }
    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
