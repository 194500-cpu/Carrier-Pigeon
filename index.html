<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pigeon Messenger Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #3ecf8e; --user-msg: #3b82f6; --bg: #0b0e11; --card: #1c2127; --input: #2d333b; --border: #444c56; --text: #adbac7; --header: #ffffff; }
        body.light-mode { --bg: #f6f8fa; --card: #ffffff; --input: #f6f8fa; --border: #d0d7de; --text: #24292f; --header: #1f2328; }
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; height: 100vh; margin: 0; padding: 10px; overflow: hidden; }

        .container { width: 100%; max-width: 450px; background: var(--card); border-radius: 32px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .screen { display: none; flex-direction: column; height: calc(100% - 65px); padding: 20px; }
        .active { display: flex; }

        input { background: var(--input); border: 1px solid var(--border); color: var(--header); padding: 16px; border-radius: 14px; outline: none; width: 100%; margin-bottom: 10px;}
        button { border: none; padding: 16px; border-radius: 14px; font-weight: 600; cursor: pointer; background: var(--primary); color: #000; }
        .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: #ff4d4d !important; color: white !important; }

        #output { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 10px 0; }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-size: 15px; position: relative; cursor: pointer; }
        .msg-me { align-self: flex-end; background: var(--user-msg); color: white; border-bottom-right-radius: 4px; }
        .msg-other { align-self: flex-start; background: var(--input); color: var(--header); border-bottom-left-radius: 4px; }
        .msg-sender { font-size: 10px; font-weight: bold; margin-bottom: 4px; opacity: 0.7; display: block; color: var(--primary); }
        .time { font-size: 9px; opacity: 0.5; margin-top: 4px; display: block; text-align: right; }

        #chat-settings-sheet { position: absolute; bottom: -100%; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); z-index: 100; padding: 25px; display: flex; flex-direction: column; gap: 15px; transition: 0.3s; border-radius: 25px 25px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.3); }
        .sheet-open { bottom: 0 !important; }

        .nav-bar { position: absolute; bottom: 0; width: 100%; height: 65px; background: var(--card); display: flex; border-top: 1px solid var(--border); z-index: 10; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; font-weight: bold; opacity: 0.5; }
        .active-nav { opacity: 1; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="screen active" style="justify-content:center;">
        <h1 style="text-align:center; color:var(--header);">Vault Chat</h1>
        <input type="text" id="login-user" placeholder="Username">
        <input type="password" id="login-pass" placeholder="Password">
        <button onclick="handleAuth()">Sign In</button>
    </div>

    <div id="home-screen" class="screen">
        <h2 style="margin-top:0;">Messages</h2>
        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:20px;">
            <input type="text" id="target-user" placeholder="User or Group Name...">
            <div style="display:flex; gap:8px;">
                <button onclick="startChat('private')" style="flex:1;">+ Private</button>
                <button onclick="startChat('group')" style="flex:1; background:#9b59b6; color:white;">+ Group</button>
            </div>
        </div>
        <div id="chat-list" style="overflow-y:auto; flex:1;"></div>
    </div>

    <div id="settings-screen" class="screen">
        <h2 style="margin-top:0;">Settings</h2>
        <button class="btn-ghost" onclick="toggleTheme()" style="width:100%; margin-bottom:10px;">🌓 Appearance</button>
        <button class="btn-danger" onclick="logout()" style="margin-top:auto;">Sign Out</button>
    </div>

    <div id="chat-window" class="screen" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:50; background:var(--card);">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px;">
            <button onclick="closeChat()" style="background:none; color:var(--text); border:none; font-size:20px; cursor:pointer;">←</button>
            <b id="chat-title" style="color:var(--header);">Chat</b>
            <button onclick="toggleSheet()" style="background:none; color:var(--text); border:none; font-size:20px; cursor:pointer;">⚙️</button>
        </div>
        <div id="output"></div>
        <div style="display:flex; gap:10px; padding-top:10px;">
            <input type="text" id="msg" placeholder="Message..." style="margin-bottom:0;">
            <button onclick="sendMsg()" style="width:60px;">➤</button>
        </div>
    </div>

    <div id="chat-settings-sheet">
        <button class="btn-danger" onclick="deleteHistory()">🗑️ Wipe Chat History</button>
        <button class="btn-ghost" onclick="toggleSheet()">Cancel</button>
    </div>

    <div class="nav-bar" id="bottom-nav" style="display:none">
        <div class="nav-item active-nav" id="nav-home" onclick="navTo('home-screen')">CHATS</div>
        <div class="nav-item" id="nav-settings" onclick="navTo('settings-screen')">SETTINGS</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://qlfdggzilndvtbyfqbdb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsZmRnZ3ppbG5kdnRieWZxYmRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwNDUwOTgsImV4cCI6MjA4NzYyMTA5OH0.XlzFZSAimDc2SxEAwGn18wqEtDF3mqzYe6nW93OzZpU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let myUser = "", activeRoom = "", chatInterval = null;

    async function handleAuth() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value;
        const { error } = await _supabase.auth.signInWithPassword({email: u+'@chat.com', password: p});
        if (error) alert(error.message); else checkUser();
    }

    async function checkUser() {
        const { data: { user } } = await _supabase.auth.getUser();
        if (user) {
            myUser = user.email.split('@')[0];
            document.getElementById('bottom-nav').style.display = 'flex';
            navTo('home-screen');
        }
    }

    async function startChat(type) {
        const target = document.getElementById('target-user').value.trim();
        if(!target) return;
        const roomId = type === 'group' ? 'group_' + target : [myUser, target].sort().join('_');
        await _supabase.from('messages').insert([{ content: 'Joined chat.', username: 'System', room_id: roomId }]);
        openChat(roomId, target);
        document.getElementById('target-user').value = '';
    }

    function openChat(rid, title) {
        activeRoom = rid;
        document.getElementById('chat-title').innerText = title.replace('group_', '');
        document.getElementById('chat-window').classList.add('active');
        loadMessages();
        if(chatInterval) clearInterval(chatInterval);
        chatInterval = setInterval(loadMessages, 3000);
    }

    async function loadMessages() {
        if(!activeRoom) return;
        const { data } = await _supabase.from('messages').select('*').eq('room_id', activeRoom).order('created_at', {ascending: true});
        const out = document.getElementById('output');
        const isAtBottom = out.scrollHeight - out.clientHeight <= out.scrollTop + 50;

        let html = "";
        data?.forEach(m => {
            const isMe = m.username === myUser;
            const time = new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            html += `
                <div class="msg ${isMe ? 'msg-me' : 'msg-other'}" onclick="${isMe ? `deleteMsg('${m.id}')` : ''}">
                    ${activeRoom.startsWith('group_') && !isMe ? `<span class="msg-sender">${m.username}</span>` : ''}
                    ${m.content}
                    <span class="time">${time}</span>
                </div>`;
        });
        out.innerHTML = html;
        if(isAtBottom) out.scrollTop = out.scrollHeight;
    }

    async function sendMsg() {
        const el = document.getElementById('msg');
        if(!el.value.trim()) return;
        await _supabase.from('messages').insert([{ content: el.value, username: myUser, room_id: activeRoom }]);
        el.value = ''; loadMessages();
    }

    async function deleteMsg(id) { if(confirm("Delete message?")) { await _supabase.from('messages').delete().eq('id', id); loadMessages(); } }
    async function deleteHistory() { if(confirm("Wipe all history?")) { await _supabase.from('messages').delete().eq('room_id', activeRoom); toggleSheet(); loadMessages(); } }

    async function loadChatHub() {
        const { data } = await _supabase.from('messages').select('room_id').neq('room_id', null);
        const unique = [...new Set(data.map(d => d.room_id))].filter(r => r.includes(myUser) || r.startsWith('group_'));
        document.getElementById('chat-list').innerHTML = unique.map(r => `
            <button class="btn-ghost" onclick="openChat('${r}', '${r}')" style="width:100%; margin-bottom:10px; text-align:left; padding:15px; border-radius:18px;">
                ${r.startsWith('group_') ? '👥 ' + r.replace('group_', '') : '👤 ' + r.replace(myUser, '').replace('_','')}
            </button>`).join('');
    }

    function navTo(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
        document.getElementById('nav-' + id.split('-')[0]).classList.add('active-nav');
        if(id === 'home-screen') loadChatHub();
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function toggleSheet() { document.getElementById('chat-settings-sheet').classList.toggle('sheet-open'); }
    function closeChat() { document.getElementById('chat-window').classList.remove('active'); activeRoom = ""; clearInterval(chatInterval); }
    async function logout() { await _supabase.auth.signOut(); location.reload(); }

    document.getElementById('msg').addEventListener('keydown', e => e.key === 'Enter' && sendMsg());
    checkUser();
</script>
</body>
</html>
